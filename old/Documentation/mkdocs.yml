site_name: SeamLess
repo_url: https://github.com/tu-studio/seamless-docs

theme:
  name: material
  highlightjs: true
#   logo: graphics/interface_HVC_small.png
  palette:
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom

      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.indexes

plugins:
#    - with-pdf
#    - search
#    - mkpdfs

# bibtex:
#      bib_file: "refs.bib"
#      cite_style: "pandoc"
extra:
    generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences


