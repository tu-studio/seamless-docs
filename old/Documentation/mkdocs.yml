site_name: SeamLess
repo_url: https://github.com/tu-studio/seamless-docs

theme:
  name: material
  highlightjs: true
  logo: graphics/interface_HVC_small.png
  features:
    - navigation.indexes

plugins:
#    - with-pdf
#    - search
#    - mkpdfs

# bibtex:
#      bib_file: "refs.bib"
#      cite_style: "pandoc"
extra:
    generator: false

markdown_extensions:
  - attr_list
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences


